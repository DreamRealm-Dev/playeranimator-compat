plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.134'
}

group = 'com.example'
version = '1.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Player Animation Library 1.1.6 is third-party and is NOT redistributed here.
    // Place 'PlayerAnimationLibNeoforge-1.1.6+mc.1.21.1.jar' into ./libs/ before building.
    compileOnly files('libs/PlayerAnimationLibNeoforge-1.1.6+mc.1.21.1.jar')
}

neoForge {
    version = '21.1.111'

    runs {
        create('client') {
            client()
        }
        create('server') {
            server()
        }
    }

    mods {
        create('playeranimator') {
            sourceSet(sourceSets.main)
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

